name: VirtualApp 16 Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/virtualapp16-build.yml"

permissions:
  contents: read

jobs:
  build-virtualapp16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CloneLite workflow repository
        uses: actions/checkout@v4

      - name: Checkout VirtualApp_16 source
        uses: actions/checkout@v4
        with:
          repository: f0restw0w/VirtualApp_16
          ref: main
          path: virtualapp16

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: virtualapp16/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Build VirtualApp_16 APKs from source
        working-directory: virtualapp16
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: List generated APKs
        working-directory: virtualapp16
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APKs for Infinix Hot 11S NFC testing
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-16-Android11-test
          path: |
            virtualapp16/app/build/outputs/apk/debug/*arm64-v8a*.apk
            virtualapp16/app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn
          retention-days: 7
