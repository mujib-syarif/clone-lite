name: VirtualApp 16 Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/virtualapp16-build.yml"

jobs:
  build-virtualapp16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CloneLite workflow repository
        uses: actions/checkout@v4

      - name: Checkout VirtualApp_16 source
        uses: actions/checkout@v4
        with:
          repository: f0restw0w/VirtualApp_16
          ref: main
          path: virtualapp16

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install required Android SDK and NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529"
          yes | sdkmanager --licenses

      - name: Build VirtualApp_16 APKs from source
        working-directory: virtualapp16
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APKs for device testing
        uses: actions/upload-artifact@v4
        with:
          name: VirtualApp-16-source-build
          path: virtualapp16/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
